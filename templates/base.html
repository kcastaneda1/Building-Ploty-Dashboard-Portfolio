<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ken Castaneda | Data Analytics Portfolio{% endblock %}</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- ========================= -->
    <!-- Navigation -->
    <!-- ========================= -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                Ken Dashboard
            </a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

                <span class="navbar-toggler-icon"></span>
            </button>
            <div
                class="collapse navbar-collapse"
                id="navbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#about">
                            About
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#portfolio">
                            Portfolio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">
                            Contact
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- ========================= -->
    <!-- Page Content -->
    <!-- ========================= -->
    {% block content %}
    {% endblock %}
    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->
    <footer id="contact">
        <div class="container text-center">
            <h3>Let's Connect</h3>
            <p>
                Interested in analytics, dashboards, or data engineering?
                I'd love to connect.
            </p>
            <div class="social-links">
                <a
                    href="https://www.linkedin.com/in/kenneth-castaneda-1437701a2/"
                    target="_blank">
                    <i class="bi bi-linkedin"></i>
                </a>
                <a
                    href="https://github.com/kcastaneda1"
                    target="_blank">
                    <i class="bi bi-github"></i>
                </a>
            </div>
            <p class="copyright">
                © 2026 Ken Castaneda
            </p>
        </div>
    </footer>
    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
